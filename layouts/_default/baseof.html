<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="flex flex-col min-h-dvh justify-between px-2">
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50
              focus:bg-zinc-100 dark:focus:bg-surface focus:px-2 focus:py-1 focus:rounded-sm">
      Skip to content
    </a>
    <header class="container m-auto flex flex-col pt-3 gap-3">
      {{ partial "nav.html" . }}
      <div class="search-row">
        <div id="search" class="search-bar grow min-w-0" role="search" aria-label="Site search"></div>
        <script>
          document.addEventListener("DOMContentLoaded", function () {
            // The index only exists after a `pagefind` run; dev servers lack it.
            if (typeof PagefindUI === "undefined") return;
            new PagefindUI({
              element: "#search",
              showSubResults: true,
              pageSize: 3,
              excerptLength: 16,
              showImages: false,
            });
          });
        </script>
        {{ if and .IsPage (not .Params.notoc) (findRE "<li" .TableOfContents) }}
        <button type="button" class="shrink-0 ml-1.5" id="toc-btn" aria-label="Toggle Table of Contents"
                aria-expanded="false" aria-controls="TableOfContents">
          <svg class="icon icon-lg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
            <!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc. -->
            <path fill="currentColor" d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM64 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L96 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z"/>
          </svg>
        </button>
        {{ end }}
      </div>
    </header>
    <main id="main-content" class="container content mt-0 m-auto z-0 grow">
      {{ block "main" . }} {{ end }}
    </main>
    {{ partial "footer.html" . }} {{ partial "extra_js.html" . }}
  </body>
</html>
