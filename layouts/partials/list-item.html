<div class="sm:mx-8" itemscope itemtype="https://schema.org/BlogPosting">
    <a href="{{ .Permalink }}" itemprop="url" class="block border-b
             text-dark dark:text-fg
             border-zinc-300 dark:border-fg-muted/30
             hover:bg-zinc-100 dark:hover:bg-surface
             active:bg-zinc-200 dark:active:bg-fg-muted/10
             rounded-sm transition-colors duration-100 py-2">
        <h2 itemprop="name" class="text-xl border-none pb-0 m-0">{{ .Title }}</h2>
        {{ if .Params.Date }}
        <div class="list-item-date text-right text-sm leading-[1.75rem] text-fg-secondary dark:text-fg-muted">{{ partial "post-date.html" .Date }}</div>
        {{ end }}
    </a>
    <meta itemprop="author" content="{{ site.Params.author.name }}">
    {{ if .Params.Date }}<meta itemprop="datePublished" content="{{ .Date.Format "2006-01-02" }}">{{ end }}
</div>
