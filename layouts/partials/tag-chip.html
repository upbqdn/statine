{{- /* Tag chip. Dict params: url, name; optional: count (superscript badge),
     filter (emit data-pagefind-filter), link_class, span_class, style. */ -}}
<a class="border-none text-dark dark:text-fg {{ .link_class }}"
   href='{{ .url }}'
   {{- if .count }} aria-label="{{ .name }} ({{ .count }} {{ if eq .count 1 }}post{{ else }}posts{{ end }})"{{ end }}>
    <span class="bg-zinc-100 dark:bg-surface
                 hover:bg-zinc-200 active:bg-zinc-200
                 dark:hover:bg-fg-muted/20 dark:active:bg-fg-muted/20
                 border border-zinc-300 dark:border-fg-muted/30
                 hover:border-zinc-500 active:border-zinc-500
                 dark:hover:border-fg-muted/50 dark:active:border-fg-muted/50
                 rounded-sm transition-colors duration-100 {{ .span_class }}"
          {{- if .filter }} data-pagefind-filter="tags"{{ end }}
          {{- with .style }} style="{{ . | safeCSS }}"{{ end }}>
        {{ .name }}{{ with .count }}<sup style="font-size: 0.75rem;" aria-hidden="true">{{ . }}</sup>{{ end }}
    </span>
</a>
